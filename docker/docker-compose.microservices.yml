      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/contentservice?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - CONSUL_URL=consul:8500
      - GOVERNANCE_SERVICE_PORT=8084
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - redis
      - consul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  hr-service:
    build:
      context: ..
      dockerfile: docker/services/hr/Dockerfile
    container_name: acs-hr-service
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/contentservice?sslmode=disable
      - REDIS_URL=redis://redis:6379
