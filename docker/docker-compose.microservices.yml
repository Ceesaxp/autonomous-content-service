      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/contentservice?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - CONSUL_URL=consul:8500
      - FINANCIAL_SERVICE_PORT=8083
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - redis
      - consul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
