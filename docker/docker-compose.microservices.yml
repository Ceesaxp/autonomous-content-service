      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/contentservice?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - CONSUL_URL=consul:8500
      - LEGAL_SERVICE_PORT=8086
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - redis
      - consul
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
